<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    height: 100vh;
    background-size: cover;
    background-position: center;
    animation: bgSlide 20s infinite;
    font-family: 'Quicksand', sans-serif;
    color: #fff6fb;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top, rgba(255,255,255,0.25), transparent 60%),
                radial-gradient(circle at bottom, rgba(255,182,255,0.25), transparent 60%);
    pointer-events: none;
}

.login-box {
    width: 300px;
    margin: 100px auto;
    padding: 30px;
    background: rgba(255, 220, 240, 0.65);
    border-radius: 20px;
    backdrop-filter: blur(10px);
    text-align: center;
    position: relative;
    animation: glowPulse 3s ease-in-out infinite;
}

@keyframes glowPulse {
    0% {
        box-shadow:
            0 0 10px rgba(251, 119, 198, 0.233),
            0 0 20px rgba(255, 120, 201, 0.412);
    }

    50% {
        box-shadow:
            0 0 18px rgba(255, 150, 209, 0.261),
            0 0 35px rgba(255, 150, 209, 0.413);
    }

    100% {
        box-shadow:
            0 0 10px rgba(255, 120, 201, 0.333),
            0 0 20px rgba(255, 120, 201, 0.385);
    }
}


h1, p {
    color: #fffafc;
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
}

.form-control {
    border-radius: 30px;
    background: rgba(255, 240, 246, 0.658);
    border: 1px solid rgba(255, 120, 181, 0.3);
    color: #744259;
    padding: 10px 15px;
}

.form-control:focus {
    background: rgba(255, 240, 246, 0.658) !important;
    color: #744259 !important;
    border: 1px solid rgba(255, 120, 212, 0.5);
    box-shadow: 0 0 8px rgba(255, 0, 183, 0.5);
}

.form-control::placeholder {
    color: #744259;
}

.form-control:hover {
    box-shadow: 0 0 10px rgba(255, 120, 181, 0.5);
    transition: 0.3s;
}

.btn-primary {
    font-weight: bold;
    background: linear-gradient(135deg, #ff9ad5, #ffd1ff);
    border: none;
    color: #744259;
    box-shadow: 0 0 10px rgba(255, 170, 220, 0.6);
    transition: all 0.2s ease;
}

.btn-primary:hover {
    color: #744259;
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255, 0, 140, 0.4),
                0 0 30px rgba(255, 120, 208, 0.2)
}

.forgot-btn {
    margin-top: 10px;
    background: transparent;
    border: none;
    color: #fff6fb;
    text-decoration: underline;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s ease;
}

.forgot-btn:hover {
    color:#ff9ad5;
}

@keyframes bgSlide {
    0%   { background-image: url('https://i.pinimg.com/736x/f0/8d/1d/f08d1d62860208a40a99e0757291ce0f.jpg'); }
    20%  { background-image: url('https://i.pinimg.com/736x/ba/e0/82/bae08256846bfc0b9437870b4c53527f.jpg'); }
    40%  { background-image: url('https://i.pinimg.com/1200x/e8/7d/66/e87d66ecae21aa20243be3bc6b7702eb.jpg'); }
    60%  { background-image: url('https://i.pinimg.com/1200x/8f/c0/00/8fc000b8aed1691fb63f91597b6264bf.jpg'); }
    80%  { background-image: url('https://i.pinimg.com/1200x/b3/94/1c/b3941c38d791dc846adf788b319db400.jpg'); }
    100% { background-image: url('https://i.pinimg.com/736x/f0/8d/1d/f08d1d62860208a40a99e0757291ce0f.jpg'); }
}

.typing {
    display: inline-block;
    font-size: 2.2rem;
    font-weight: 700;
    color: #fffafc;
    text-shadow: 0 2px 10px rgba(255, 143, 212, 0.6);
    overflow: hidden;
    white-space: nowrap;
    border-right: .15em solid white;
    width: 0;
    margin: 0 auto;
    animation:
        typing 2.2s steps(6, end) forwards,
        blink .7s infinite;
}



@keyframes typing {
    from { width: 0 }
    to { width: 6ch }
}

@keyframes blink {
    50% { border-color: transparent }
}

#instructions {
    background: rgba(255, 120, 161, 0.15);
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    border: 1px solid rgba(255, 120, 194, 0.4);
    color:#744259;
}


.instruction-btn {
    text-align: center;
}

.arrow {
    list-style: none;
    cursor: pointer;
    font-size: 1.4rem;
    color: #744259;
    display: inline-block;
    transition: transform 0.3s ease;
    user-select: none;
    
}

summary::-webkit-details-marker {
    display: none;
}

details[open] .arrow {
    transform: rotate(90deg);
}
        
.sprite {
    width: 220px; 
    position: absolute;
    bottom: 20px;
    right: 20px;
    cursor: pointer;
    transition: transform 0.3s ease, filter 0.3s ease, box-shadow 0.3s ease;
}

.sprite2 {
    width: 400px; 
    position: absolute;
    bottom: 20px;
    left: 20px;
    cursor: pointer;
    transition: transform 0.3s ease, filter 0.3s ease, box-shadow 0.3s ease;
}

.sprite:hover {
    transform: scale(1.1);
    filter: drop-shadow(0 0 15px hotpink);
    box-shadow: 0 0 25px rgba(255, 105, 180, 0.8);
}

.sprite2:hover {
    transform: scale(1.1);
    filter: drop-shadow(0 0 15px hotpink);
    box-shadow: 0 0 25px rgba(255, 105, 180, 0.8);
}

</style>
</head>

<body>
<div class="login-box">
    <h1 class="typing">Login</h1>

    <details class="instruction-btn mb-3" ontoggle="showInstructions()">
        <summary class="arrow">▸</summary>
        <p id="instructions" style="margin-top:10px;"></p>
    </details>

    <form onsubmit="login(); return false;">
        <input type="text" id="username" class="form-control mb-3" placeholder="Username">
        <input type="password" id="password" class="form-control mb-3" placeholder="Password">
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <button class="forgot-btn" onclick="reveal()">Forgot username/password?</button>
</div>

<script>
let attempts = 3; 

function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "rainbowdash" && pass === "applejack") {
        alert("⭐Login Successful!");
        window.location.href = "notebooks.html";
    } else {
        attempts--;

        if(attempts > 0) {
            alert("❌Wrong username or password! ☹️ \nAttempts left: " + attempts);
        } else {
            alert("Too many failed attempts! 😿 Login disabled. 💩");

            document.getElementById("username").disabled = true;
            document.getElementById("password").disabled = true;
            document.querySelector(".btn-primary").disabled = true;
        }
    }
}

function reveal() {
    alert("Username: rainbowdash\nPassword: applejack");
}
</script>

<img src="https://www.pngall.com/wp-content/uploads/15/Emu-Otori-PNG-Free-Image.png" alt="Sprite" class="sprite" onclick="wondehoy()">

<img src="https://www.pngall.com/wp-content/uploads/15/Emu-Otori-PNG-Picture.png" alt="Sprite2" class="sprite2" onclick="wondehoy()">

<script>
function wondehoy() {
    alert("⭐WONDERHOY!!!");
}

function showInstructions() {
        document.getElementById("instructions").innerHTML = 
                "Enter the correct username and password.";
        }

</script>

</body>
</html>
