<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    height: 100vh;
    background-size: cover;
    background-position: center;
    animation: bgSlide 20s infinite;
    font-family: 'Quicksand', sans-serif;
    color: #fff6fb;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top, rgba(255,255,255,0.25), transparent 60%),
                radial-gradient(circle at bottom, rgba(255,182,255,0.25), transparent 60%);
    pointer-events: none;
}

.login-box {
    width: 300px;
    margin: 100px auto;
    padding: 30px;
    background: rgba(255, 220, 240, 0.65);
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(255, 240, 150, 0.6);
    backdrop-filter: blur(10px);
    text-align: center;
    position: relative;
}

h1, p {
    color: #fffafc;
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
}

.form-control {
    border-radius: 12px;
    border: none;
}

.btn-primary {
    background: linear-gradient(135deg, #ff9ad5, #ffd1ff);
    border: none;
    color: white;
    box-shadow: 0 0 10px rgba(255, 170, 220, 0.6);
    transition: transform 0.2s ease;
}

.btn-primary:hover {
    transform: scale(1.05);
}

.forgot-btn {
    margin-top: 10px;
    background: transparent;
    border: none;
    color: #fff6fb;
    text-decoration: underline;
    font-size: 0.9rem;
    cursor: pointer;
}

@keyframes bgSlide {
    0%   { background-image: url('https://i.pinimg.com/736x/e5/dd/aa/e5ddaa798de57c50d39dcede6614eae8.jpg'); }
    20%  { background-image: url('https://i.pinimg.com/736x/f3/81/ff/f381ff15d461aa431eabd512053412d3.jpg'); }
    40%  { background-image: url('https://i.pinimg.com/736x/35/e1/cb/35e1cba932ccfad22e88c5358960eacc.jpg'); }
    60%  { background-image: url('https://i.pinimg.com/1200x/5f/4e/e5/5f4ee5a89ae375c9bed02099cbcb5d94.jpg'); }
    80%  { background-image: url('https://i.pinimg.com/736x/89/e8/c8/89e8c805fe0e4d0fca8e9670c081ff86.jpg'); }
    100% { background-image: url('https://i.pinimg.com/736x/e5/dd/aa/e5ddaa798de57c50d39dcede6614eae8.jpg'); }
}

.typing {
    overflow: hidden;
    border-right: .15em solid white;
    white-space: nowrap;
    margin: 0 auto;
    animation: typing 2s steps(10, end), blink .7s infinite;
    width: 0;
}

@keyframes typing {
    from { width: 0 }
    to { width: 100% }
}

@keyframes blink {
    50% { border-color: transparent }
}
</style>
</head>

<body>

<div class="login-box">
    <h1 class="typing">Login</h1>
    <p>Enter username and password</p>

    <form onsubmit="login(); return false;">
        <input type="text" id="username" class="form-control mb-3" placeholder="Username">
        <input type="password" id="password" class="form-control mb-3" placeholder="Password">
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <button class="forgot-btn" onclick="reveal()">Forgot username/password?</button>
</div>

<script>
function login() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "rainbowdash" && pass === "applejack") {
        alert("Login Successful!");
        window.location.href = "notebooks.html";
    } else {
        alert("Wrong username or password!");
    }
}

function reveal() {
    alert("Username: rainbowdash\nPassword: applejack");
}
</script>

</body>
</html>
