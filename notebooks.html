<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notebooks</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffd6ec, #d6f0ff, #fff3b0);
    overflow-x: hidden;
    color: #ffffff;
    padding-left: 240px;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at top, rgba(255,255,255,0.3), transparent 60%),
                radial-gradient(circle at bottom, rgba(255,182,255,0.25), transparent 60%);
    z-index: -1;
}

.header {
    text-align: center;
    margin-top: 40px;
    margin-bottom: 20px;
}

.title {
    display: inline-block;
    padding: 14px 30px;
    font-size: 30px;
    font-weight: 600;
    color: #ffffff;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(12px);
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 22px;
    padding: 30px;
    max-width: 1000px;
    margin: auto;
}

.notebook {
    height: 180px;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    color: white;
    font-weight: 600;
    font-size: 1.2rem;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    transition: 0.3s ease;
    position: relative;
    overflow: hidden;
}

.notebook:hover {
    transform: scale(1.07);
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
}

.notebook::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top left, rgba(255,255,255,0.3), transparent 60%);
}

.math { background: linear-gradient(135deg, #ff9ad5, #ffd1ff); }
.english { background: linear-gradient(135deg, #9ad0ff, #d6f0ff); }
.ss { background: linear-gradient(135deg, #ffe29a, #fff3b0); }
.science { background: linear-gradient(135deg, #a6ffcb, #9afcff); }

.tle { background: linear-gradient(135deg, #c9a7ff, #e3d1ff); }
.peh { background: linear-gradient(135deg, #ffb3c6, #ffd6e0); }
.ict { background: linear-gradient(135deg, #a0c4ff, #bde0fe); }
.music { background: linear-gradient(135deg, #ffd6a5, #ffe5b4); }

.sub {
    font-size: 0.75rem;
    font-weight: 400;
    opacity: 0.9;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    height: 100vh;
    width: 230px;

    display: flex;
    flex-direction: column;

    padding: 25px 15px;

    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(14px);
    box-shadow: 5px 0 25px rgba(0,0,0,0.15);

    z-index: 1000;
}

.sidebar-title {
    font-weight: 600;
    font-size: 18px;
    text-align: center;
    margin-bottom: 30px;
    color: white;
}

.side-link {
    display: block;
    padding: 12px 14px;
    margin: 6px 0;
    border-radius: 12px;

    text-decoration: none;
    color: white;
    font-weight: 500;

    transition: 0.25s ease;
}

.side-link:hover {
    background: rgba(255,255,255,0.3);
    transform: translateX(5px);
}

.logout {
    margin-top: auto;
    background: rgba(255, 120, 160, 0.4);
}

.logout:hover {
    background: rgba(255, 120, 160, 0.6);
}
</style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-title">🌸 Virtual Notebooks</div>

    <a href="#" class="side-link">📊 Dashboard</a>
    <a href="#" class="side-link">👤 Profile</a>
    <a href="#" class="side-link logout">🚪 Logout</a>
</div>

<div class="header">
    <div class="title">📒 My Notebooks</div>
</div>

<div class="grid">

    <a href="#" class="notebook math">
        Math
        <div class="sub">logic & numbers</div>
    </a>

    <a href="#" class="notebook english">
        English
        <div class="sub">words & stories</div>
    </a>

    <a href="#" class="notebook ss">
        Social Studies
        <div class="sub">history & society</div>
    </a>

    <a href="#" class="notebook science">
        Science
        <div class="sub">discovery & experiments</div>
    </a>

    <a href="#" class="notebook tle">
        TLE
        <div class="sub">skills & practice</div>
    </a>

    <a href="#" class="notebook peh">
        PEH
        <div class="sub">health & movement</div>
    </a>

    <a href="#" class="notebook ict">
        ICT
        <div class="sub">tech & coding</div>
    </a>

    <a href="#" class="notebook music">
        Music & Arts
        <div class="sub">creativity & expression</div>
    </a>

</div>

</body>
</html>
