<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notebooks</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
    
body {
    font-family: 'Quicksand', sans-serif;
    background-image: url('https://i.pinimg.com/originals/56/92/43/5692438f5fda7dab1afb39c8f9cae2ec.gif');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    color: #fff6fb;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at top, rgba(255, 240, 250, 0.4), transparent 60%),
                radial-gradient(circle at bottom, rgba(210, 230, 255, 0.35), transparent 60%);
    z-index: -1;
}

.header {
    text-align: center;
    margin-top: 35px;
    margin-bottom: 15px;
}

.title {
    display: inline-block;
    padding: 12px 26px;
    font-size: 28px;
    font-weight: 600;
    backdrop-filter: blur(10px);
    border-radius: 14px;
    box-shadow: 0 8px 18px rgba(255, 144, 181, 0.62);
    letter-spacing: 1px;
    animation: bgSlide 20s infinite;
    text-shadow: 0 2px 10px rgba(213, 56, 87, 0.6);
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 18px;
    padding: 25px;
    max-width: 1000px;
    margin: auto;
}

.notebook {
    color:#2f3e55;
    height: 170px;
    border-radius: 14px; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-decoration: none;
    font-weight: 600;
    font-size: 1.15rem;
    box-shadow: 0 8px 18px rgba(0,0,0,0.12);
    transition: 0.25s ease;
    position: relative;
    overflow: hidden;
}

.notebook:hover {
    transform: translateY(-4px) scale(1.06);
    box-shadow: 0 0 12px rgba(255, 150, 213, 0.7);
}

.notebook::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent 60%);
}

.math { background: linear-gradient(135deg, #ffb3d1, #ffd6ea); }
.english { background: linear-gradient(135deg, #b9d9ff, #e1f0ff); }
.ss { background: linear-gradient(135deg, #ffe6a6, #fff3cc); }
.science { background: linear-gradient(135deg, #b8f7d3, #d9fff0); }
.tle { background: linear-gradient(135deg, #d7c2ff, #eee3ff); }
.peh { background: linear-gradient(135deg, #ffc2d1, #ffe3ea); }
.ict { background: linear-gradient(135deg, #b7d7ff, #d9ecff); }
.music { background: linear-gradient(135deg, #ffd9b3, #ffe9cc); }

.sub {
    font-size: 0.75rem;
    font-weight: 400;
    opacity: 0.85;
}

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    height: 100vh;
    width: 230px;
    display: flex;
    flex-direction: column;
    padding: 22px 14px;
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(12px);
    box-shadow: 5px 0 20px rgba(0,0,0,0.12);
}

.sidebar-title {
    font-weight: 600;
    font-size: 16px;
    text-align: center;
    margin-bottom: 25px;
    color: #2f3e55;
}

.side-link {
    display: block;
    padding: 11px 12px;
    margin: 5px 0;
    border-radius: 10px; 
    text-decoration: none;
    color: #2f3e55;
    font-weight: 500;
    transition: 0.2s ease;
}

.side-link:hover {
    background: rgba(255,255,255,0.6);
    transform: translateX(4px);
}

.logout {
    margin-top: auto;
    background: rgba(255, 170, 190, 0.35);
}

.logout:hover {
    background: rgba(255, 170, 190, 0.55);
}

@keyframes bgSlide {
    0%   { background-image: url('https://i.pinimg.com/736x/f0/8d/1d/f08d1d62860208a40a99e0757291ce0f.jpg'); }
    20%  { background-image: url('https://i.pinimg.com/736x/ba/e0/82/bae08256846bfc0b9437870b4c53527f.jpg'); }
    40%  { background-image: url('https://i.pinimg.com/1200x/e8/7d/66/e87d66ecae21aa20243be3bc6b7702eb.jpg'); }
    60%  { background-image: url('https://i.pinimg.com/1200x/8f/c0/00/8fc000b8aed1691fb63f91597b6264bf.jpg'); }
    80%  { background-image: url('https://i.pinimg.com/1200x/b3/94/1c/b3941c38d791dc846adf788b319db400.jpg'); }
    100% { background-image: url('https://i.pinimg.com/736x/f0/8d/1d/f08d1d62860208a40a99e0757291ce0f.jpg'); }
}
</style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-title">🌸 Virtual Notebooks</div>

    <a href="dashboard.html" class="side-link">📊 Dashboard</a>
    <a href="profile.html" class="side-link">👤 Profile</a>
    <a href="tasks.html" class="side-link">📝 Tasks</a>
    <a href="#" class="side-link logout">🚪 Logout</a>
</div>

<div class="header">
    <div class="title">📒 My Notebooks</div>
</div>

<div class="grid">

    <a href="#" class="notebook math">
        Math
        <div class="sub">logic & numbers</div>
    </a>

    <a href="#" class="notebook english">
        English
        <div class="sub">words & stories</div>
    </a>

    <a href="#" class="notebook ss">
        Social Studies
        <div class="sub">history & society</div>
    </a>

    <a href="#" class="notebook science">
        Science
        <div class="sub">discovery & experiments</div>
    </a>

    <a href="#" class="notebook tle">
        TLE
        <div class="sub">skills & practice</div>
    </a>

    <a href="#" class="notebook peh">
        PEH
        <div class="sub">health & movement</div>
    </a>

    <a href="#" class="notebook ict">
        ICT
        <div class="sub">tech & coding</div>
    </a>

    <a href="#" class="notebook music">
        Music & Arts
        <div class="sub">creativity & expression</div>
    </a>

</div>

</body>
</html>
