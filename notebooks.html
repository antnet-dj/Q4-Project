<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notebooks</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #ffd6ec, #d6f0ff, #fff3b0);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.header {
    margin-top: 40px;
    text-align: center;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(0,0,0,0.2);
}

.header h1 {
    font-weight: 600;
}

.grid {
    margin-top: 40px;
    display: grid;
    grid-template-columns: repeat(2, 180px);
    gap: 25px;
}

.notebook {
    height: 180px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: 600;
    font-size: 1.2rem;
    text-decoration: none;
    box-shadow: 0 10px 20px rgba(0,0,0,0.15);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.notebook:hover {
    transform: scale(1.05);
    box-shadow: 0 15px 25px rgba(0,0,0,0.25);
}

.math { background: linear-gradient(135deg, #ff9ad5, #ffd1ff); }
.english { background: linear-gradient(135deg, #9ad0ff, #d6f0ff); }
.ss { background: linear-gradient(135deg, #ffe29a, #fff3b0); }
.science { background: linear-gradient(135deg, #a6ffcb, #9afcff); }

.sub {
    font-size: 0.8rem;
    font-weight: 400;
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="header">
    <h1>📒 My Notebooks</h1>
    <p>choose a subject to open your world ✨</p>
</div>

<div class="grid">

    <a href="#" class="notebook math">
        Math
        <div class="sub">numbers & logic</div>
    </a>

    <a href="#" class="notebook english">
        English
        <div class="sub">words & stories</div>
    </a>

    <a href="#" class="notebook ss">
        Social Studies
        <div class="sub">history & society</div>
    </a>

    <a href="#" class="notebook science">
        Science
        <div class="sub">experiments & discovery</div>
    </a>

</div>

</body>
</html>
